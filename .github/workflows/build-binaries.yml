name: Build binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: qwic-linux-amd64
            binary: qwic
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            artifact: qwic-windows-amd64
            binary: qwic.exe
          - name: macos-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: qwic-macos-arm64
            binary: qwic

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Report toolchain
        run: go version

      - name: Read compiler version
        id: version
        shell: bash
        run: |
          version="$(go run ./cmd/qwic --version)"
          version="${version#qwic version }"

          if [[ -z "${version}" || "${version}" == *" "* ]]; then
            echo "Unable to read a valid compiler version" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match compiler version ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Verify C compiler
        run: cc --version

      - name: Test
        run: go test ./...

      - name: Build qwic
        run: go build -trimpath -o dist/${{ matrix.binary }} ./cmd/qwic
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}

      - name: Package binary
        shell: pwsh
        run: |
          $archive = "dist/qwic-${{ matrix.name }}-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -LiteralPath "dist/${{ matrix.binary }}" -DestinationPath $archive

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ steps.version.outputs.version }}
          path: dist/qwic-${{ matrix.name }}-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: qwic-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/*.zip \
              --verify-tag \
              --prerelease \
              --title "QwicLang ${GITHUB_REF_NAME}" \
              --notes-file RELEASE-NOTE.md
          fi
