name: Build binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            artifact: qwic-linux-amd64
            binary: qwic
          - name: windows-amd64
            os: windows-latest
            artifact: qwic-windows-amd64
            binary: qwic.exe
          - name: macos-arm64
            os: macos-latest
            artifact: qwic-macos-arm64
            binary: qwic

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Verify C compiler
        run: cc --version

      - name: Test
        run: go test ./...

      - name: Build qwic
        run: go build -trimpath -o dist/${{ matrix.binary }} ./cmd/qwic

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qwic-linux-amd64/qwic
            dist/qwic-windows-amd64/qwic.exe
            dist/qwic-macos-arm64/qwic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
